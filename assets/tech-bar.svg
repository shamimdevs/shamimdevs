<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .label { font: 14px 'Segoe UI', Roboto, Arial; fill: #333; }
    .value { font: 12px 'Segoe UI', Roboto, Arial; fill: #fff; }
    .bar { rx: 6; ry: 6; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="40" y="34" class="label" font-weight="700" font-size="18">Technical Proficiency</text>

  <!-- Bars -->
  <!-- Labels on left -->
  <g transform="translate(40,70)">
    <!-- Row template: y offset, label, width percent -->
    <g transform="translate(0,0)">
      <text x="0" y="18" class="label">Frontend (Next.js / React)</text>
      <rect x="260" y="2" width="520" height="28" fill="#e6eef8" class="bar"/>
      <rect x="260" y="2" width="468" height="28" fill="#1f77b4" class="bar"/>
      <text x="792" y="22" class="value">90%</text>
    </g>

    <g transform="translate(0,60)">
      <text x="0" y="18" class="label">Backend (Node / NestJS / Laravel)</text>
      <rect x="260" y="2" width="520" height="28" fill="#f1f6e9" class="bar"/>
      <rect x="260" y="2" width="446" height="28" fill="#2ca02c" class="bar"/>
      <text x="792" y="22" class="value">86%</text>
    </g>

    <g transform="translate(0,120)">
      <text x="0" y="18" class="label">Databases (Postgres / Mongo)</text>
      <rect x="260" y="2" width="520" height="28" fill="#fff4e6" class="bar"/>
      <rect x="260" y="2" width="468" height="28" fill="#ff7f0e" class="bar"/>
      <text x="792" y="22" class="value">90%</text>
    </g>

    <g transform="translate(0,180)">
      <text x="0" y="18" class="label">DevOps (Docker / K8s / CI-CD)</text>
      <rect x="260" y="2" width="520" height="28" fill="#f3f0ff" class="bar"/>
      <rect x="260" y="2" width="416" height="28" fill="#9467bd" class="bar"/>
      <text x="792" y="22" class="value">80%</text>
    </g>

    <g transform="translate(0,240)">
      <text x="0" y="18" class="label">Mobile (React Native)</text>
      <rect x="260" y="2" width="520" height="28" fill="#eef9f6" class="bar"/>
      <rect x="260" y="2" width="442" height="28" fill="#17becf" class="bar"/>
      <text x="792" y="22" class="value">85%</text>
    </g>

    <g transform="translate(0,300)">
      <text x="0" y="18" class="label">Testing & Quality</text>
      <rect x="260" y="2" width="520" height="28" fill="#fff0f6" class="bar"/>
      <rect x="260" y="2" width="416" height="28" fill="#d62728" class="bar"/>
      <text x="792" y="22" class="value">80%</text>
    </g>
  </g>
</svg>