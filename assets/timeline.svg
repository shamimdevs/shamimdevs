<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <style>
    .year { font: 13px 'Segoe UI', Roboto, Arial; fill:#333; font-weight:700 }
    .event { font: 12px 'Segoe UI', Roboto, Arial; fill:#333 }
    .dot { fill:#1f77b4 }
    .line { stroke:#ddd; stroke-width:2 }
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="40" y="28" class="year">Career Timeline</text>

  <!-- Horizontal timeline -->
  <g transform="translate(60,60)">
    <line x1="0" y1="120" x2="760" y2="120" class="line" />

    <!-- 2016 -->
    <g transform="translate(0,0)">
      <circle cx="0" cy="120" r="8" class="dot"/>
      <text x="0" y="152" class="year">2016</text>
      <text x="0" y="170" class="event">Backend Engineer — High-throughput APIs</text>
    </g>

    <!-- 2019 -->
    <g transform="translate(240,0)">
      <circle cx="0" cy="120" r="8" class="dot"/>
      <text x="0" y="152" class="year">2019</text>
      <text x="0" y="170" class="event">Full-stack: Laravel migration & Mobile app</text>
    </g>

    <!-- 2022 -->
    <g transform="translate(480,0)">
      <circle cx="0" cy="120" r="8" class="dot"/>
      <text x="0" y="152" class="year">2022</text>
      <text x="0" y="170" class="event">Senior Full-Stack: Next.js, NestJS, K8s</text>
    </g>

    <!-- 2024+ -->
    <g transform="translate(760,0)">
      <circle cx="0" cy="120" r="8" class="dot"/>
      <text x="-30" y="152" class="year">2024–Now</text>
      <text x="-120" y="170" class="event">Scaling platforms, CI/CD, Cloud architecture</text>
    </g>
  </g>
</svg>